server {
    listen 8000;

    # Ne pas annoncer la version de nginx (en-tête Server, pages d'erreur).
    server_tokens off;

    root /var/www/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        # Une connexion FastCGI par requête : la réutiliser ouvrait la voie à
        # la contrebande de requêtes de PHP-FPM (CVE-2026-129289). C'est la
        # valeur par défaut de nginx ; l'écrire empêche de l'oublier.
        fastcgi_keep_conn off;
    }

    location ~ /\.ht {
        deny all;
    }
}